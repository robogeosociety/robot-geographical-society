name = "robot-geographical-society-backend"
main = "src/index.ts"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]

# This is a PRIVATE project: the Worker must NOT be reachable on the open internet
# without a trusted auth boundary. The *.workers.dev route is disabled — the Worker
# is served only via an Access-protected custom domain (see web/BACKEND_AUTH.md).
# Do not flip this back to true without a gate in front. See the gate-before-deploy
# and private-no-public-exposure rules.
workers_dev = false

[[kv_namespaces]]
binding = "CAMPSITES"
id = "aad9f04d90e945ffb8d278d7b8e70976"
preview_id = "aad9f04d90e945ffb8d278d7b8e70976"

# Availability snapshots. Layout: raw/<date>/<agency>/<id>.json (upstream payloads),
# summary/<date>/<id>.json (campground aggregate — the Mac pulls these → InfluxDB),
# sites/<date>/<id>.json (per-individual-campsite breakdown — see CAMPSITE-PLAN.md).
[[r2_buckets]]
binding = "RAW"
bucket_name = "campsite-raw"

# Per-run/per-site collector coverage → queried by the observability "Collector
# history" Grafana dashboard via the AE SQL API. Schema:
#   index=site.id  blob1=date blob2=agency blob3=kind blob4=name
#   blob5=status(ok|failed|inactive|reactivated)  double1=datesCollected (or failure
#   count on an "inactive" row)  double2=durationMs
[[analytics_engine_datasets]]
binding = "COLLECTOR_AE"
dataset = "campsite_collector"

# One row per collector run (run-level totals). Schema:
#   index=date  blob1=date  double1=total double2=ok double3=failed double4=empty
[[analytics_engine_datasets]]
binding = "RUNS_AE"
dataset = "campsite_collector_runs"

# Per-site availability rollup (one row per site per run). Schema:
#   index=site.id  blob1=date blob2=agency blob3=name
#   double1=siteNightsAvailable double2=siteNightsReserved double3=siteNightsTotal double4=datesOpen
[[analytics_engine_datasets]]
binding = "AVAIL_AE"
dataset = "campsite_availability"

# Dense per-check hot-date watch points. Schema:
#   index=site.id  blob1=targetDate blob2=agency blob3=name
#   double1=available double2=reserved double3=total
[[analytics_engine_datasets]]
binding = "WATCH_AE"
dataset = "campsite_watch"

[vars]
# The one knob: every campsite is refreshed within this many days. No fixed schedule.
MAX_STALENESS_DAYS = "2"

# Consecutive failures before a site is quarantined: removed from the schedule,
# written to the DLQ (dlq/<id>.json in R2), and emitted as an "inactive" state
# change in the campsite_collector AE dataset. Failed sites back off exponentially
# (10m, 20m, 40m, …) until they reach this count, so a permanently-dead site stops
# being retried instead of failing ~144×/day. A daily probe (or POST
# /collect/reactivate?id=) can revive it.
INACTIVE_AFTER_FAILURES = "5"

# No cron. The CollectorLoop self-perpetuates via continue-as-new; a hard crash
# is surfaced by Grafana → Discord staleness alerting (observability repo), and a
# human restarts it with POST /collect/start?force=1.

# Deadline-driven durable collector loop (self-schedules via step.sleep,
# continues-as-new to bound history).
[[workflows]]
name = "campsite-collector"
binding = "COLLECTOR_WF"
class_name = "CollectorLoop"

[[workflows]]
name = "campsite-hot-date-watch"
binding = "WATCH_WF"
class_name = "HotDateWatchWorkflow"

[observability]
enabled = true
