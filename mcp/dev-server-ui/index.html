<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dev-server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 13px;
      background: #111;
      color: #ccc;
      padding: 2rem;
    }
    h1 { font-size: 13px; color: #555; font-weight: normal; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th { color: #444; font-weight: normal; text-align: left; padding: 0.3rem 1.2rem 0.3rem 0; border-bottom: 1px solid #222; }
    td { padding: 0.4rem 1.2rem 0.4rem 0; border-bottom: 1px solid #1e1e1e; vertical-align: top; }
    a { color: #4a9eff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: #444; margin-top: 1rem; }
    .updated { color: #333; margin-top: 1.5rem; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #2a2; margin-right: 0.5rem; vertical-align: middle; }
  </style>
</head>
<body>
  <h1>dev-server</h1>
  <div id="app"></div>
  <script type="module">
    async function render() {
      let data;
      try {
        const res = await fetch(import.meta.env.BASE_URL + 'dev-servers.json?t=' + Date.now());
        data = await res.json();
      } catch {
        document.getElementById('app').innerHTML = '<p class="empty">could not load dev-servers.json</p>';
        return;
      }

      const entries = Object.values(data.servers || {});
      const app = document.getElementById('app');

      if (!entries.length) {
        app.innerHTML = '<p class="empty">no active servers</p>';
        return;
      }

      app.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>project</th>
              <th>type</th>
              <th>port</th>
              <th>local</th>
              <th>tailscale</th>
            </tr>
          </thead>
          <tbody>
            ${entries.map(s => `
              <tr>
                <td><span class="dot"></span>${s.project}</td>
                <td>${s.type}</td>
                <td>${s.port}</td>
                <td><a href="${s.localUrl}" target="_blank">${s.localUrl}</a></td>
                <td>${s.tailscaleUrl ? `<a href="${s.tailscaleUrl}" target="_blank">${s.tailscaleUrl}</a>` : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <p class="updated">updated ${new Date(data.updated).toLocaleTimeString()}</p>
      `;
    }

    render();
    setInterval(render, 5000);
  </script>
</body>
</html>
