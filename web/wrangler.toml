# Cloudflare Pages project config for the frontend.
# Deploy:  npx wrangler pages deploy dist   (from web/)
# The Pages app is gated by Cloudflare Access (SSO) on its custom domains
# (campsites./collectors.robogeosociety.xyz) and the *.pages.dev alias — see
# infra/access. The /api/* Pages Function reaches the backend via the BACKEND
# service binding below (no token, internal).
name = "robot-geographical-society-web"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# Internal binding to the backend Worker (Hono) — used by functions/api/[[path]].js.
[[services]]
binding = "BACKEND"
service = "robot-geographical-society-backend"
