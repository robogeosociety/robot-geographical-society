<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Robot Geographical Society — scout bot">
  <defs>
    <linearGradient id="rgs-body" x1="20" y1="8" x2="40" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.55" stop-color="#eaf2f6"></stop>
      <stop offset="1" stop-color="#cddde7"></stop>
    </linearGradient>
    <radialGradient id="rgs-eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#bff0fb"></stop>
      <stop offset="0.5" stop-color="#66d9ef"></stop>
      <stop offset="1" stop-color="#2aa6c9"></stop>
    </radialGradient>
    <filter id="rgs-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  
  <ellipse cx="32" cy="59" rx="12" ry="2.4" fill="#0a141d" opacity="0.22"></ellipse>

  
  <line x1="32" y1="9" x2="32" y2="4.5" stroke="#cddde7" stroke-width="1.6" stroke-linecap="round"></line>
  <circle cx="32" cy="3.4" r="2" fill="url(#rgs-eye)" filter="url(#rgs-glow)"></circle>

  
  <g transform="rotate(-7 32 33)">
    <ellipse cx="32" cy="32" rx="17.5" ry="21" fill="url(#rgs-body)"></ellipse>
    
    <ellipse cx="26" cy="26" rx="5" ry="9" fill="#ffffff" opacity="0.65"></ellipse>

    
    <path d="M16.5 25.5&#xA;             a15.5 9 0 0 1 31 0&#xA;             a15.5 11 0 0 1 -31 0 Z" fill="#0f1e2a"></path>
    
    <path d="M18 22 a14 6 0 0 1 28 0 a14 6 0 0 1 -28 0 Z" fill="#1c3a4c" opacity="0.6"></path>

    
    <g filter="url(#rgs-glow)">
      <rect x="23.5" y="22" width="4.2" height="8.4" rx="2.1" transform="rotate(8 25.6 26.2)" fill="url(#rgs-eye)"></rect>
      <rect x="36.3" y="22" width="4.2" height="8.4" rx="2.1" transform="rotate(-8 38.4 26.2)" fill="url(#rgs-eye)"></rect>
    </g>
  </g>

  
  <g transform="translate(32 45)">
    <circle r="7.6" fill="#0f1e2a" stroke="#93acba" stroke-width="1"></circle>
    <circle r="7.6" fill="none" stroke="#66d9ef" stroke-width="0.6" opacity="0.5"></circle>
    
    <path d="M0 -5 L2 0 L0 1.4 L-2 0 Z" fill="#f2b15a"></path>
    <path d="M0 5 L2 0 L0 -1.4 L-2 0 Z" fill="#e8f1f6"></path>
    <circle r="1" fill="#0a141d" stroke="#cddde7" stroke-width="0.6"></circle>
    
    <circle cx="0" cy="-6.4" r="0.7" fill="#f2b15a"></circle>
  </g>
