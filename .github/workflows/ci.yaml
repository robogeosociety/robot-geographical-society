name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g concurrently wrangler wait-on
          cd backend && npm install
          cd ../web && npm install

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Sync data and Seed KV
        run: |
          node scripts/sync-geojson.js
          cd backend && node scripts/generate-seed.cjs
          npx wrangler kv bulk put kv-seed.json --binding CAMPSITES --local --preview false

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit Tests
        working-directory: web
        run: npm test -- --run

      - name: Build and E2E Test
        working-directory: web
        env:
          VITE_MAPBOX_ACCESS_TOKEN: pk.eyJ1Ijoiam9lIiwiYSI6ImNsamVnZzFpZzAwZHYzZ214ZzFqZzFqZzEifQ.fake-token
        run: |
          # Use concurrently to run the dev servers and the build process in parallel.
          # The build process will wait for the ports to be open before running.
          npx concurrently --success first --kill-others \
            "cd ../backend && npx wrangler dev --port 8787 --local --ip 0.0.0.0" \
            "npx vite --port 5173 --host 0.0.0.0" \
            "npx wait-on http-get://localhost:8787/ http-get://localhost:5173/ && npm run build"
