name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g concurrently wrangler
          cd backend && npm install
          cd ../web && npm install

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit Tests
        working-directory: web
        run: npm test -- --run

      - name: Build and E2E Test
        working-directory: web
        env:
          VITE_MAPBOX_ACCESS_TOKEN: pk.eyJ1Ijoiam9lIiwiYSI6ImNsamVnZzFpZzAwZHYzZ214ZzFqZzFqZzFqZzEifQ.fake-token
        run: |
          # 1. Sync data and seed local KV
          cd .. && node scripts/sync-geojson.js
          cd backend && node scripts/generate-seed.cjs
          npx wrangler kv bulk put kv-seed.json --binding CAMPSITES --local --preview false
          
          # 2. Build the frontend (which triggers E2E via postbuild)
          # We run the dev server in background for E2E tests to hit
          cd ../web
          npx concurrently --success first --kill-others \
            "cd ../backend && npx wrangler dev --port 8787 --local --ip 0.0.0.0" \
            "npx vite --port 5173 --host 0.0.0.0" \
            "sleep 10 && npm run build"
