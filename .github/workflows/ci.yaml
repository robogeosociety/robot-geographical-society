name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'data/**'

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          npm install -g wrangler
          cd backend && npm install
          cd ../web && npm install

      - name: Install Playwright Browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Backend unit tests + typecheck
        working-directory: backend
        run: |
          npx vitest run
          npm run typecheck

      - name: Sync data and Seed KV
        run: |
          node scripts/sync-geojson.js
          cd backend && node scripts/generate-seed.cjs
          npx wrangler kv bulk put kv-seed.json --binding CAMPSITES --local --preview false

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit Tests
        working-directory: web
        run: npm test -- --run

      - name: Build and E2E Test
        working-directory: web
        env:
          VITE_MAPBOX_ACCESS_TOKEN: pk.eyJ1Ijoiam9lIiwiYSI6ImNsamVnZzFpZzAwZHYzZ214ZzFqZzFqZzEifQ.fake-token
          CI: true
          WRANGLER_SEND_METRICS: false
          # Drive the e2e through the authenticated /api proxy. The Vite proxy targets
          # the local wrangler-dev backend and attaches these Access service-token
          # headers (exercising the production auth wiring). The local backend ignores
          # them — real creds live in web/.env.local for dev against the gated backend.
          BACKEND_URL: http://127.0.0.1:8787
          CF_ACCESS_CLIENT_ID: ci-dummy.access
          CF_ACCESS_CLIENT_SECRET: ci-dummy-secret
        run: |
          # Use 127.0.0.1 for everything. Wait-on will ensure ports are open and responding correctly.
          ./node_modules/.bin/concurrently --success first --kill-others \
            "cd ../backend && npx wrangler dev --port 8787 --local --ip 127.0.0.1" \
            "npx vite --port 5173 --host 127.0.0.1" \
            "./node_modules/.bin/wait-on -t 90000 http-get://127.0.0.1:8787/ http-get://127.0.0.1:5173/ && npm run build"
