[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campsite-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ipyfilechooser>=0.6.0",
    "jupyter",
    "metaflow>=2.12",
    "nbconvert",
    "playwright>=1.40",
    "pyyaml>=6.0.3",
    "tenacity>=8.0",
]

[project.scripts]
refresh = "refresh_flow:main"
crawl = "scripts.crawl_rec_gov:main"

[tool.hatch.build.targets.wheel]
packages = ["campsite_sync", "scripts"]
include = ["refresh_flow.py"]

[dependency-groups]
dev = [
    "playwright>=1.40",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that make real network requests (deselect with -m 'not slow')",
]
