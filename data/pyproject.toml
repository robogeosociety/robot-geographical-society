[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campsite-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ipyfilechooser>=0.6.0",
    "jupyter",
    "nbconvert",
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
]

[project.scripts]
update = "scripts.update_campsites:main"
generate = "scripts.sync_to_geojson:main"

[tool.hatch.build.targets.wheel]
packages = ["campsite_sync", "scripts"]

[dependency-groups]
dev = [
    "playwright>=1.40",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
